<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akses – TATA</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <!-- Konfigurasi Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Bricolage Grotesque', 'sans-serif'],
            sans: ['Source Sans 3', 'sans-serif'],
          },
          colors: {
            toba: '#0E4A5C',
            deep: '#0A3340',
            ulos: '#A8281F',
            mist: '#EEF3F3',
            ink: '#17262B',
          },
        },
      },
    };
  </script>

  <!-- Custom Utility Classes -->
  <style type="text/tailwindcss">
    .b {
      @apply inline-block rounded-full px-2.5 py-0.5 text-xs font-semibold;
    }
    .btn {
      @apply inline-flex items-center justify-center rounded-lg bg-toba px-4 py-2.5 text-sm font-semibold text-white hover:bg-deep focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-toba;
    }
    .btn2 {
      @apply inline-flex items-center justify-center rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-ink hover:bg-mist;
    }
    .btnr {
      @apply inline-flex items-center justify-center rounded-lg bg-ulos px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-900;
    }
    .in {
      @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm focus:border-toba focus:outline-none;
    }
    .card {
      @apply rounded-xl border border-slate-200 bg-white p-5;
    }
    .lb {
      @apply mb-1 block text-sm font-semibold;
    }
    .map {
      background:
        linear-gradient(#cfe3e6 1px, transparent 1px) 0 0 / 32px 32px,
        linear-gradient(90deg, #cfe3e6 1px, transparent 1px) 0 0 / 32px 32px,
        #e4eff0;
    }
  </style>
</head>

<body class="bg-mist font-sans text-ink">
  <div class="mx-auto max-w-6xl p-5">
    
    <!-- Header / Logo -->
    <a href="index.html" class="font-display text-2xl font-bold text-toba">
      TATA
    </a>

    <!-- Grid 3 Kolom: Masuk, Daftar, OTP -->
    <div class="mt-6 grid gap-6 lg:grid-cols-3">
      
      <!-- 1. Form Masuk -->
      <section class="card space-y-4">
        <h2 class="font-display text-xl font-bold">Masuk</h2>

        <div>
          <label class="lb">Email</label>
          <input type="email" class="in" placeholder="nama@email.com">
        </div>

        <div>
          <label class="lb">Kata sandi</label>
          <input type="password" class="in" value="password">
        </div>

        <!-- Notifikasi Akun Dinonaktifkan -->
        <div class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-800">
          Akun Anda dinonaktifkan karena konten tidak pantas. Hubungi admin kecamatan.
        </div>

        <button type="button" class="btn w-full">Masuk</button>

        <p class="text-center text-sm text-slate-600">
          Belum punya akun? Daftar
        </p>
      </section>

      <!-- 2. Form Daftar Akun Warga -->
      <section class="card space-y-4">
        <h2 class="font-display text-xl font-bold">Daftar akun warga</h2>

        <div>
          <label class="lb">Nama lengkap</label>
          <input type="text" class="in">
        </div>

        <div>
          <label class="lb">Email</label>
          <input type="email" class="in">
        </div>

        <div>
          <label class="lb">Desa</label>
          <select class="in">
            <option>Pilih desa</option>
            <option>Lumban Rau</option>
          </select>
        </div>

        <div>
          <label class="lb">Kata sandi</label>
          <input type="password" class="in">
        </div>

        <button type="button" class="btn w-full">Kirim kode OTP</button>
      </section>

      <!-- 3. Form Verifikasi OTP -->
      <section class="card space-y-4">
        <h2 class="font-display text-xl font-bold">Verifikasi OTP</h2>
        <p class="text-sm text-slate-600">
          Masukkan 6 digit kode yang dikirim ke email Anda.
        </p>

        <!-- Kotak Input 6 Digit OTP -->
        <div class="flex justify-between gap-2">
          <input type="text" maxlength="1" class="in text-center text-lg" value="4">
          <input type="text" maxlength="1" class="in text-center text-lg" value="8">
          <input type="text" maxlength="1" class="in text-center text-lg" value="1">
          <input type="text" maxlength="1" class="in text-center text-lg">
          <input type="text" maxlength="1" class="in text-center text-lg">
          <input type="text" maxlength="1" class="in text-center text-lg">
        </div>

        <p class="text-sm text-slate-600">Kirim ulang kode dalam 00:42</p>

        <button type="button" class="btn w-full">Verifikasi</button>

        <!-- Notifikasi Berhasil -->
        <div class="rounded-lg bg-green-50 p-3 text-sm text-green-800">
          Verifikasi berhasil. Silakan masuk.
        </div>
      </section>

    </div>
  </div>
</body>
</html>
